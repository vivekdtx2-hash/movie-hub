<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Movie Hub - Sign Up</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-[#080e12] text-white flex items-center justify-center px-5">

    <div class="w-full max-w-md">

        <!-- Logo -->
        <div class="text-center mb-8">

            <h1 class="text-3xl font-semibold">
                Movie <span class="text-yellow-400">Hub</span>
            </h1>

            <p class="text-gray-500 mt-2">
                Create your account
            </p>

        </div>


        <!-- Sign Up Box -->
        <div class="p-7 rounded-2xl
                    bg-[#11191f]
                    border border-white/10">

            <h2 class="text-2xl font-medium mb-6">
                Sign Up
            </h2>


            <form id="signupForm">

                <!-- Name -->
                <div class="mb-4">

                    <label class="text-sm text-gray-400">
                        Full Name
                    </label>

                    <input
                        id="name"
                        type="text"
                        placeholder="Enter your name"
                        required
                        class="w-full mt-2 px-4 py-3
                               rounded-xl
                               bg-[#080e12]
                               border border-white/10
                               text-white
                               outline-none
                               focus:border-yellow-400"
                    >

                </div>


                <!-- Address -->
                <div class="mb-4">

                    <label class="text-sm text-gray-400">
                        Address
                    </label>

                    <input
                        id="address"
                        type="text"
                        placeholder="Enter your address"
                        required
                        class="w-full mt-2 px-4 py-3
                               rounded-xl
                               bg-[#080e12]
                               border border-white/10
                               text-white
                               outline-none
                               focus:border-yellow-400"
                    >

                </div>


                <!-- Gmail -->
                <div class="mb-4">

                    <label class="text-sm text-gray-400">
                        Gmail
                    </label>

                    <input
                        id="email"
                        type="email"
                        placeholder="Enter your Gmail"
                        required
                        class="w-full mt-2 px-4 py-3
                               rounded-xl
                               bg-[#080e12]
                               border border-white/10
                               text-white
                               outline-none
                               focus:border-yellow-400"
                    >

                </div>


                <!-- Password -->
                <div class="mb-6">

                    <label class="text-sm text-gray-400">
                        Password
                    </label>

                    <input
                        id="password"
                        type="password"
                        placeholder="Create a password"
                        required
                        class="w-full mt-2 px-4 py-3
                               rounded-xl
                               bg-[#080e12]
                               border border-white/10
                               text-white
                               outline-none
                               focus:border-yellow-400"
                    >

                </div>


                <!-- Sign Up Button -->
                <button
                    type="submit"
                    class="w-full py-3 rounded-xl
                           bg-yellow-400
                           text-black
                           font-semibold
                           hover:bg-yellow-300
                           transition">
                    Sign Up
                </button>

            </form>


            <!-- Success Message -->
            <div
                id="successMessage"
                class="hidden mt-5 p-4 rounded-xl
                       border border-green-400/30
                       bg-green-400/10
                       text-green-400 text-center">
            </div>

        </div>

    </div>


    <script src="Login.js"></script>

</body>

</html>
