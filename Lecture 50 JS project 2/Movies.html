<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Movie Hub - Movies</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-[#080e12] text-white min-h-screen">

    <!-- Header -->
    <header class="px-[6%] py-5 border-b border-white/10">
        <div class="flex items-center justify-between">

            <h1 class="text-2xl md:text-3xl font-extrabold">
                Movie <span class="text-yellow-400">Hub</span>
            </h1>

            <a href="index.html"
                class="px-5 py-2 rounded-xl bg-white/10 hover:bg-yellow-400 hover:text-black transition">
                Home
            </a>

        </div>
    </header>


    <!-- Page Title -->
    <section class="px-[6%] pt-10">

        <p class="text-yellow-400 font-bold uppercase tracking-widest">
            Explore
        </p>

        <h2 class="text-4xl md:text-5xl font-extrabold mt-2">
            Movies
        </h2>

        <p class="text-gray-400 mt-3">
            Choose a movie and explore its details.
        </p>

    </section>


    <!-- Movies -->
    <section class="px-[6%] py-10">

        <div id="moviesGrid"
            class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-5">
        </div>

    </section>


    <!-- Movie Details Modal -->
    <div id="movieModal"
        class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm
               items-center justify-center p-5">

        <div
            class="relative w-full max-w-4xl max-h-[90vh] overflow-y-auto
                   bg-[#11191f] border border-white/10 rounded-2xl p-6">

            <button id="closeModal"
                class="absolute right-5 top-5 w-10 h-10 rounded-full
                       bg-white/10 hover:bg-red-500 transition text-xl">
                ✕
            </button>

            <div id="movieDetails"></div>

        </div>

    </div>


    <script src="Movies.js"></script>

</body>

</html>
